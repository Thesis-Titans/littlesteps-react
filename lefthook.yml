# Lefthook pre-commit checks for LittleSteps Web
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js}"
      run: npm run lint --silent
    typecheck:
      glob: "*.{ts,tsx}"
      run: npm run typecheck --silent
    secret-scan:
      run: >
        gitleaks detect
        --source .
        --no-banner
        --exit-code 1
      fail_text: |
        Gitleaks detected a potential secret in staged files.
        Remove any credentials before committing.
